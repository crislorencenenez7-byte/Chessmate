services:
  - type: web
    name: chessmate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: FRONTEND_ORIGIN
        value: https://crislorencenenez7-byte.github.io
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
